name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: ruff check src tests airflow/dags

      - name: Check formatting
        run: ruff format --check src tests airflow/dags

      - name: Run unit tests
        run: python -m pytest -m "not integration"

  airflow-validate:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Airflow image
        run: docker build -f airflow/Dockerfile -t weather-airflow:ci .

      - name: Validate Airflow DAGs
        run: |
          docker run --rm \
            -v "$PWD/airflow/dags:/opt/airflow/dags:ro" \
            weather-airflow:ci \
            python -c "from airflow.dag_processing.dagbag import DagBag; bag = DagBag(dag_folder='/opt/airflow/dags'); assert not bag.import_errors, bag.import_errors; assert bag.get_dag('weather_data_pipeline') is not None"

  integration:
    needs: test
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: weather_test_db
      POSTGRES_USER: weather_test_user
      POSTGRES_PASSWORD: weather_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: weather_test_db
          POSTGRES_USER: weather_test_user
          POSTGRES_PASSWORD: weather_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U weather_test_user -d weather_test_db"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply database migration
        run: |
          PGPASSWORD=$POSTGRES_PASSWORD psql \
            -h $POSTGRES_HOST \
            -p $POSTGRES_PORT \
            -U $POSTGRES_USER \
            -d $POSTGRES_DB \
            -f sql/001_create_weather_forecasts.sql

      - name: Run integration tests
        run: python -m pytest -m integration

  docker-build:
    needs:
      - integration
      - airflow-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t weather-pipeline:ci .
